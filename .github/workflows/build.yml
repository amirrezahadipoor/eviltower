name: تست و بسته‌بندی برج شیطانی

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: تست موتور بازی
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x ./gradlew
      - run: ./gradlew test lint --stacktrace

  package:
    name: APK نهایی برای کافه‌بازار
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: آماده‌سازی کلید انتشار
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > eviltower-release.jks
            echo "storeFile=eviltower-release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          else
            echo "::warning::کلید واقعی تنظیم نشده؛ کلید موقت برای آزمون ساخته می‌شود."
            keytool -genkeypair -v -keystore eviltower-release.jks -alias eviltower -keyalg RSA -keysize 2048 -validity 10000 -storepass eviltower -keypass eviltower -dname "CN=Evil Tower, OU=Games, O=Hadipoor, L=Montreal, S=Quebec, C=CA"
            printf 'storeFile=eviltower-release.jks\nstorePassword=eviltower\nkeyAlias=eviltower\nkeyPassword=eviltower\n' > keystore.properties
          fi
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eviltower-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eviltower-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: انتشار در Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: برج شیطانی — APK ${{ github.run_number }}
          body: "خروجی‌های debug و release ساخته‌شده از کامیت ${{ github.sha }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
